name: CI PR Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  detect-docker-changes:
    runs-on: ubuntu-latest
    outputs:
      docker_changed: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            docker:
              - 'docker_images/**'
              - '.github/workflows/docker_management.*'
              - '.github/workflows/ci_scripts/**'
              - '**/Dockerfile'
              - 'requirements.txt'

  build-pr-container:
    needs: detect-docker-changes
    if: needs.detect-docker-changes.outputs.docker_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push PR container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker_images/mbed-os-env/Dockerfile
          push: true
          tags: ghcr.io/mbed-ce/mbed-os-env-tmp:pr-${{ github.event.number }}-${{ github.sha }}

  select-container:
    needs: [detect-docker-changes, build-pr-container]
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.set.outputs.container }}
    steps:
      - id: set
        run: |
          if [ "${{ needs.detect-docker-changes.outputs.docker_changed }}" = "true" ]; then
            echo "container=ghcr.io/mbed-ce/mbed-os-env-tmp:pr-${{ github.event.number }}-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "container=ghcr.io/mbed-ce/mbed-os-env:main-latest" >> $GITHUB_OUTPUT

  basic-checks:
    needs: select-container
    runs-on: ubuntu-latest
    container: ${{ needs.select-container.outputs.container }}
    steps:
      - uses: actions/checkout@v6
      - run: echo "Run license, unit tests, doxygen, etc."

  build-greentea:
    needs: select-container
    runs-on: ubuntu-latest
    container: ${{ needs.select-container.outputs.container }}
    steps:
      - uses: actions/checkout@v6
      - run: echo "Run greentea CMake compilation check"
