name: Docker PR Validation

on:
  pull_request:
    paths:
      - docker_images/mbed-ce-env/**
      - .github/workflows/docker-pr.yml

concurrency:
  group: docker-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          file: ./docker_images/mbed-ce-env/Dockerfile
          load: true
          tags: mbed-ce-env:ci-local

      - name: Checkout Mbed CE Hello World repo
        uses: actions/checkout@v7
        with:
          repository: mbed-ce/mbed-ce-hello-world
          path: mbed-ce-hello-world

      - name: Remove mbed-os from example-application
        shell: bash
        run: |
          cd mbed-ce-hello-world
          rm -rf mbed-os

      - name: Checkout mbed-os
        uses: actions/checkout@v7
        with:
          path: mbed-ce-hello-world/mbed-os

      - name: Smoke test local container image
        uses: addnab/docker-run-action@v3
        with:
          options: -v ${{ github.workspace }}:/work -w=/work --platform ${{ matrix.platform }}
          image: mbed-ce-env:ci-local
          shell: bash
          run: |
            uname -m
            cd mbed-ce-hello-world
            mkdir -p build && cd build
            cmake .. -GNinja -DCMAKE_BUILD_TYPE=Develop -DMBED_TARGET=K64F
            ninja || exit 1
