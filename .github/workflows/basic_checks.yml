# This workflow performs the checks like license check,
# doxygen, unit tests etc.
name: Basic Checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  # Set up the oldest python version that's currently still supported by Python (as of Summer 2026)
  PYTHON_VERSION: "3.10"

defaults:
  run:
    # Use bash instead of sh for commands so that 'source' works
    shell: bash

jobs:
  license-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mbed-ce/mbed-ce-env:main

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python packages
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -e ./tools[license_check]

      - name: license check
        run: |
          source .venv/bin/activate
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .github/workflows/scripts/check-licenses.sh
          

  include-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mbed-ce/mbed-ce-env:main

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: include check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # checks mbed.h is not included in MbedOS files except in tests
          ! git grep '^#include\s["'"']mbed.h['"'"]$' -- '*.c' '*.h' '*.cpp' '*.hpp' \
              ':!*platform_mbed.h' ':!*TESTS/*' ':!TEST_APPS/' ':!UNITTESTS/' \
              ':!*tests/*' ':!*targets/*' ':!*TARGET_*' ':!*unsupported/*' \
              ':!*events/tests/*' ':!*drivers/tests/*'

  style-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mbed-ce/mbed-ce-env:main
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: UTF-8 Check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Make sure we're not introducing any text which is not UTF-8 encoded
          git diff origin/${GITHUB_BASE_REF} -U0 | ( grep -a '^+' || true ) | ( ! grep -axv '.*' )

      - name: astyle checks
        run: |
          set -x
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --name-only --diff-filter=d origin/${GITHUB_BASE_REF} \
            | ( grep '.*\.\(c\|cpp\|h\|hpp\)$' || true ) \
            | ( grep -v -f .codecheckignore || true ) \
            | while read file; do astyle -n --options=.astylerc "${file}"; done
          git diff --exit-code --diff-filter=d --color

      - name: Spell Checks
        run: |
          set -x
          ./tools/test/ci/doxy-spellchecker/spell.sh drivers .codecheckignore
          ./tools/test/ci/doxy-spellchecker/spell.sh platform .codecheckignore
          ./tools/test/ci/doxy-spellchecker/spell.sh events .codecheckignore
          ./tools/test/ci/doxy-spellchecker/spell.sh rtos .codecheckignore
          ./tools/test/ci/doxy-spellchecker/spell.sh connectivity/netsocket .codecheckignore

      - name: File Naming Checks
        run: |
          mkdir BUILD
          # Assert that all binary libraries are named correctly
          # The strange command below asserts that there are exactly 0 libraries
          # in this directory tree that do not start with lib
          find "(" -name "*.a" -or -name "*.ar" ")" -and -not -name "lib*" |
          tee BUILD/badlibs |
          sed -e "s/^/Bad library name found: /" && [ ! -s BUILD/badlibs ]
          # Assert that all assembler files are named correctly
          # The strange command below asserts that there are exactly 0 files
          # in this git repo that do end with .s
          git ls-files "**/*.s" "*.s" | tee BUILD/badasm |
          sed -e "s/^/Bad Assembler file name found: /" && [ ! -s BUILD/badasm ]

      - name: Install Python packages
        shell: bash
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -e ./tools[linters]

      - name: Check Python Formatting
        run: |
          source .venv/bin/activate
          cd tools
          ruff format --diff

      - name: Check Python Lint
        run: |
          source .venv/bin/activate
          cd tools
          ruff check --diff python/mbed_tools python/mbed_platformio python/mbed_license_checker
          basedpyright

  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Create BUILD folder
        run: |
          mkdir -p ${{ github.workspace }}/BUILD

      - name: Doxygen Action
        uses: mattnotmitt/doxygen-action@v1
        with:
          doxyfile-path: ./doxyfile_options

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python packages
        run: |
          pip install -e ./tools[unit-tests]

      - name: Python Tests
        run: |
          tools/run_python_tests.sh

  check-cmsis-mcu-descriptions-matches-target-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python packages
        run: |
          pip install -e ./tools

      - name: Verify that cmsis_mcu_descriptions.json5 is in sync with targets.json5
        run: |
          cd tools/python
          mbed-tools cmsis-mcu-descr find-unused
          mbed-tools cmsis-mcu-descr check-missing

  pin-validation:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mbed-ce/mbed-ce-env:main
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: validate pins
        run: |
          export GITHUB_EVENT_BEFORE=${{ github.event.before }}
          .github/workflows/scripts/pin-validate.sh

  cmake-native-unit-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mbed-ce/mbed-ce-env:main
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build and run unit tests
        run: |
          set -x
          ctest --build-and-test . build --build-generator Ninja --build-options -DMBED_ENABLE_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=ON --test-command ctest --output-on-failure
          gcovr --gcov-executable gcov --merge-mode-functions separate -r . ./build -s -e ".*\.h" --exclude-directories=${GITHUB_WORKSPACE}/build/UNITTESTS --exclude-directories=${GITHUB_WORKSPACE}/build/_deps
          ccache -s
