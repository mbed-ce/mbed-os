# This workflow detects if any Docker-related files have changed. New Mbed CE Docker containers will be pushed to
# the GitHub Container Registry from PRs only in the event of changes to the Docker environment, else PRs will use the
# latest container from the main branch.
name: Detect Docker Changes

on:
  pull_request:
  push:

permissions:
  contents: read
  packages: write

jobs:
  detect-docker-changes:
    runs-on: ubuntu-latest

    outputs:
      docker_changed: ${{ steps.changes.outputs.docker }}

    steps:
      - uses: actions/checkout@v6

      - name: Detect Docker changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            docker:
              - 'docker_images/**'
              - '.github/workflows/docker_management.*'
              - '.github/workflows/ci_scripts/**'
              - '**/Dockerfile'
              - 'requirements.txt'

  build-pr-container:
    needs: detect-docker-changes
    if: needs.detect-docker-changes.outputs.docker_changed == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker_images/mbed-os-env/Dockerfile
          push: true
          tags: ghcr.io/mbed-ce/mbed-os-env-tmp:pr-${{ github.event.number }}-${{ github.sha }}

  test-pr-container:
    needs: build-pr-container
    if: needs.detect-docker-changes.outputs.docker_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout blinky example
        uses: actions/checkout@v6
        with:
          repository: ARMmbed/mbed-os-example-blinky
          path: blinky

      - name: Run compile test in PR container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/blinky:/workspace \
            -w /workspace \
            ghcr.io/mbed-ce/mbed-os-env-tmp:pr-${{ github.event.number }}-${{ github.sha }} \
            mbed-tools compile -m K64F -t GCC_ARM

  select-container:
    needs: [detect-docker-changes, build-pr-container, test-pr-container]
    runs-on: ubuntu-latest

    outputs:
      container: ${{ steps.set.outputs.container }}

    steps:
      - id: set
        run: |
          if [ "${{ needs.detect-docker-changes.outputs.docker_changed }}" = "true" ]; then
            echo "container=ghcr.io/mbed-ce/mbed-os-env-tmp:pr-${{ github.event.number }}-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "container=ghcr.io/mbed-ce/mbed-os-env:main-latest" >> $GITHUB_OUTPUT
          fi
