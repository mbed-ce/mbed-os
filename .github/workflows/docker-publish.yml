name: Docker Publish

on:
  push:
    branches:
      - main
    paths:
      - docker_images/mbed-ce-env/**
      - .github/workflows/docker-publish.yml

  workflow_dispatch:

  # Publish mbed-ce-X.Y.Z from GitHub releases created for mbed-os-X.Y.Z tags
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  prepare-tags:
    if: >
      github.repository == 'mbed-ce/mbed-os' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      prod_tag: ${{ steps.meta.outputs.prod_tag }}
      prod_tag_dated: ${{ steps.meta.outputs.prod_tag_dated }}

    steps:
      - name: Determine image tags and checkout ref
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            release_tag="${{ github.event.release.tag_name }}"
            if [[ ! "$release_tag" =~ ^mbed-os-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Release tag '$release_tag' is not mbed-os-X.Y.Z; cannot derive mbed-ce image tag"
              exit 1
            fi
            echo "prod_tag=mbed-ce-${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${release_tag}" >> "$GITHUB_OUTPUT"
          else
            short_sha="${GITHUB_SHA:0:7}"
            echo "prod_tag=main" >> "$GITHUB_OUTPUT"
            echo "prod_tag_dated=main-$(date -u +%Y%m%d)-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  build-container:
    if: >
      github.repository == 'mbed-ce/mbed-os' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: prepare-tags
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-tags.outputs.checkout_ref }}

      - name: Build image artifact
        uses: docker/build-push-action@v7
        id: docker_build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./docker_images/mbed-ce-env/Dockerfile
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/mbed-ce-env,push-by-digest=true,name-canonical=true,push=true

  build-and-test-container:
    if: >
      github.repository == 'mbed-ce/mbed-os' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [prepare-tags, build-container]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-tags.outputs.checkout_ref }}

      - name: Checkout Mbed CE Hello World repo
        uses: actions/checkout@v7
        with:
          repository: mbed-ce/mbed-ce-hello-world
          path: mbed-ce-hello-world

      - name: Remove mbed-os from example-application
        shell: bash
        run: |
          cd mbed-ce-hello-world
          rm -rf mbed-os

      - name: Checkout mbed-os into hello-world
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-tags.outputs.checkout_ref }}
          path: mbed-ce-hello-world/mbed-os

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Smoke test built container image
        uses: addnab/docker-run-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          options: -v ${{ github.workspace }}:/work -w=/work --platform ${{ matrix.platform }}
          image: ghcr.io/${{ github.repository_owner }}/mbed-ce-env@${{ needs.build-container.outputs.digest }}
          shell: bash
          run: |
            uname -m
            # Need to mark this path as safe so CMake can git submodule for cmsis/CMSIS_6
            git config --global --add safe.directory /work/mbed-ce-hello-world/mbed-os
            cd mbed-ce-hello-world
            mkdir -p build && cd build
            cmake .. -GNinja -DCMAKE_BUILD_TYPE=Develop -DMBED_TARGET=K64F
            ninja

  deploy-container:
    if: >
      github.repository == 'mbed-ce/mbed-os' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [prepare-tags, build-container, build-and-test-container]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tags after smoke test
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${{ github.repository_owner }}/mbed-ce-env"
          DIGEST="${{ needs.build-container.outputs.digest }}"
          TAG_ARGS=(-t "${IMAGE}:${{ needs.prepare-tags.outputs.prod_tag }}")
          DATED="${{ needs.prepare-tags.outputs.prod_tag_dated }}"
          if [ -n "$DATED" ]; then
            TAG_ARGS+=(-t "${IMAGE}:${DATED}")
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${IMAGE}@${DIGEST}"
